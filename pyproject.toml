[project]
name = "pinchana-server"
version = "0.2b0"
description = "Unified scraper server with runtime plugin discovery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "fastapi>=0.138.2",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "curl-cffi>=0.15.0",
    "fakeredis>=2.31.3",
    "pinchana-inst",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }
pinchana-inst = { path = "../pinchana-inst" }

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
