[project]
name = "pinchana-server"
version = "26.8.6"
description = "Unified scraper server with runtime plugin discovery"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pinchana-core",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
pinchana-core = { path = "../pinchana-core" }

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
